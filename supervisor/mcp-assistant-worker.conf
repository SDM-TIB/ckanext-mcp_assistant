; ckanext-mcp_assistant: the CKAN background worker that answers the assistant's
; questions in background mode (ckanext.mcp_assistant.background = true).
;
; Copy this file to /etc/supervisor/conf.d/ and start supervisord, e.g. in the
; Dockerfile and ckan-entrypoint.sh (see README, "Background mode").
;
; The worker only listens to the queue "mcp_assistant", so it never runs jobs of
; other plugins. If you change ckanext.mcp_assistant.job_queue, change the last
; word of "command" too.

[program:mcp-assistant-worker]
command=/usr/lib/ckan/default/bin/ckan -c /etc/ckan/default/ckan.ini jobs worker mcp_assistant
; how many questions can be answered at the same time (one per worker process)
numprocs=1
process_name=%(program_name)s-%(process_num)02d
autostart=true
autorestart=true
startsecs=10
; let a running question finish (up to job_timeout) before stopping
stopwaitsecs=330
killasgroup=true
; write the worker's log into the container log (docker logs ckan)
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
